# koan-site: refresh feed + deploy to GitHub Pages.
# One pipeline, three triggers: push to main, hourly cron, manual dispatch
# (the "post that" flow hits workflow_dispatch for instant publish).
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # FEED_TOKEN (fine-grained PAT, read-only on koan-posts) unlocks the
      # private posts repo; without it the feed still builds from public events.
      - name: refresh feed
        env:
          GITHUB_TOKEN: ${{ secrets.FEED_TOKEN || github.token }}
        run: node scripts/build-feed.mjs

      - name: commit feed if changed
        run: |
          git config user.name "koan-feed"
          git config user.email "actions@users.noreply.github.com"
          git add public/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "feed: refresh"
            git push
          fi

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
